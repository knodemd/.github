name: Bug report
description: Something doesn't work as expected.
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: "Knode 0.1.0, macOS 26.1"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, screenshots, a small .knode file that shows the problem (no personal data).
