name: Feature request
description: Suggest something Knode should do.
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you imagine it working. Sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you've considered or worked around it.
